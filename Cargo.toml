[package]
name = "reqwest-negotiate"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Kerberos/SPNEGO Negotiate authentication for reqwest"
repository = "https://github.com/tom-lubenow/reqwest-negotiate"
keywords = ["kerberos", "spnego", "negotiate", "reqwest", "authentication"]
categories = ["authentication", "web-programming::http-client"]

[features]
default = ["native"]
native = ["dep:cross-krb5"]
pure-rust = ["dep:rskrb5"]

[dependencies]
reqwest = { version = "0.13", default-features = false }
cross-krb5 = { version = "0.4", default-features = false, optional = true }
rskrb5 = { version = "0.2.0", default-features = false, features = ["spnego", "tokio"], optional = true }
base64 = "0.22"
thiserror = "2"

[dev-dependencies]
rasn = "0.28"
rasn-kerberos = "0.28"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
reqwest = { version = "0.13", features = ["default-tls"] }

[[example]]
name = "simple"
required-features = ["native"]

[[example]]
name = "mutual_auth"
required-features = ["native"]

[[example]]
name = "pure_rust"
required-features = ["pure-rust"]
